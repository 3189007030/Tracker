# Browser navigation without announce parameters opens the client guide.
# Real announces, default BT Accept headers, scrape and UDP are unchanged.
map "$request_method|$is_args|$http_accept" $tracker_browser_announce {
    default 0;
    ~*^GET\|\|.*text/html 1;
}
map $http_accept_language $tracker_browser_lang {
    default zh;
    ~*^en en;
}
