user www-data;
worker_processes 2;
pid /run/nginx.pid;
error_log /dev/null crit;
include /etc/nginx/modules-enabled/*.conf;
worker_rlimit_nofile 65536;
events { worker_connections 8192; multi_accept on; }
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    server_tokens off;
    access_log off;
    sendfile on;
    tcp_nodelay on;
    keepalive_timeout 15;
    keepalive_requests 1000;
    client_header_timeout 10;
    client_body_timeout 10;
    client_max_body_size 32k;
    large_client_header_buffers 2 8k;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:TLS:4m;
    ssl_session_timeout 1h;
    ssl_session_tickets off;
    upstream tracker_core { server 127.0.0.1:8081; keepalive 64; }
    upstream tracker_site { server 127.0.0.1:8080; keepalive 16; }
    map $host $tracker_health_backend {
        tracker.augrains.com tracker_site;
        default tracker_core;
    }
    include /etc/nginx/conf.d/*.conf;
}
