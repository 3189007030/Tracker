server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    return 404;
}
server {
    listen 80;
    listen [::]:80;
    server_name tracker.augrains.com udp.augrains.com;
    include /etc/nginx/tracker-locations.inc;
}
# TLS catch-all: unknown or retired hostnames are closed instead of being
# served by the tracker site. `announce.augrains.com` is retired as a public
# name; UDP clients are unaffected because UDP carries no hostname.
server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name _;
    ssl_certificate /etc/letsencrypt/live/tracker-v1/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tracker-v1/privkey.pem;
    return 444;
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name tracker.augrains.com udp.augrains.com;
    ssl_certificate /etc/letsencrypt/live/tracker-v1/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tracker-v1/privkey.pem;
    include /etc/nginx/tracker-locations.inc;
}
