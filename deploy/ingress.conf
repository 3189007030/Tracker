server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    return 404;
}
server {
    listen 80;
    listen [::]:80;
    server_name tracker.augrains.com announce.augrains.com udp.augrains.com;
    include /etc/nginx/tracker-locations.inc;
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name tracker.augrains.com announce.augrains.com udp.augrains.com;
    ssl_certificate /etc/letsencrypt/live/tracker-v1/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tracker-v1/privkey.pem;
    include /etc/nginx/tracker-locations.inc;
}
