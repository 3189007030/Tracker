server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    return 404;
}
server {
    listen 80;
    listen [::]:80;
    server_name tracker.augrains.com announce.augrains.com udp.augrains.com;
    include /etc/nginx/tracker-locations.inc;
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name tracker.augrains.com;
    ssl_certificate /etc/tracker-v1/tls/site-fullchain.pem;
    ssl_certificate_key /etc/tracker-v1/tls/site-privkey.pem;
    include /etc/nginx/tracker-locations.inc;
}
